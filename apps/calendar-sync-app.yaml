apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calendar-sync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Shion1305/k8s-GitOps.git
    targetRevision: HEAD
    path: calendar-sync
  destination:
    server: https://kubernetes.default.svc
    namespace: calendar-sync
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
