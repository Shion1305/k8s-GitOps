apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tt-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: ghcr.io/tenstorrent/helm
      chart: tt-operator
      targetRevision: 0.2.0
      helm:
        releaseName: tt-operator
        valueFiles:
          - $values/tt-operator/values.yaml
    - repoURL: https://github.com/Shion1305/k8s-GitOps.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tt-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
