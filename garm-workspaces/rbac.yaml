apiVersion: v1
kind: ServiceAccount
metadata:
  name: garm-local-path-provisioner
  namespace: garm-workspaces
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garm-local-path-provisioner
  namespace: garm-workspaces
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garm-local-path-provisioner
  namespace: garm-workspaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garm-local-path-provisioner
subjects:
  - kind: ServiceAccount
    name: garm-local-path-provisioner
    namespace: garm-workspaces
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: garm-local-path-provisioner
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: garm-local-path-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: garm-local-path-provisioner
subjects:
  - kind: ServiceAccount
    name: garm-local-path-provisioner
    namespace: garm-workspaces
