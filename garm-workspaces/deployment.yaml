apiVersion: apps/v1
kind: Deployment
metadata:
  name: garm-local-path-provisioner
  namespace: garm-workspaces
  labels:
    app.kubernetes.io/name: garm-local-path-provisioner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: garm-local-path-provisioner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garm-local-path-provisioner
    spec:
      serviceAccountName: garm-local-path-provisioner
      nodeSelector:
        kubernetes.io/hostname: shion-ubuntu-2605
      containers:
        - name: provisioner
          image: docker.io/rancher/local-path-provisioner:v0.0.37@sha256:e757967a5ec338f6a9b371c5a9688bedaa8c3578ea3dd4db329ea0084be0a86f
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - start
            - --config
            - /etc/config/config.json
            - --provisioner-name
            - shion1305.com/garm-workspaces
            - --configmap-name
            - garm-local-path-config
            - --service-account-name
            - garm-local-path-provisioner
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
            - name: HEALTH_PORT
              value: "8080"
          ports:
            - name: health
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/config/
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: garm-local-path-config
