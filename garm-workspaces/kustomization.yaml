apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - storageclass.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: garm-local-path-config
    namespace: garm-workspaces
    files:
      - config.json
      - setup=scripts/setup.sh
      - teardown=scripts/teardown.sh
      - helperPod.yaml

generatorOptions:
  disableNameSuffixHash: true
