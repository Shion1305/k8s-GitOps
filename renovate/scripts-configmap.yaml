apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-scripts
  namespace: renovate
data:
  run-renovate.sh: |
    #!/bin/bash
    set -e
    exec /scripts/run-renovate-core.sh
    # export RENOVATE_AUTODISCOVER="false"
    # echo "Running Renovate against Shion1305/k8s-GitOps only for testing..."
    # exec /scripts/run-renovate-core.sh Shion1305/k8s-GitOps

  run-renovate-core.sh: |
    #!/bin/bash
    set -euo pipefail

    echo "Starting Renovate for all GitHub App installations..."

    # Check required environment variables
    if [ -z "${RENOVATE_APP_ID:-}" ] || [ -z "${RENOVATE_APP_PRIVATE_KEY:-}" ]; then
      echo "ERROR: RENOVATE_APP_ID and RENOVATE_APP_PRIVATE_KEY must be set"
      exit 1
    fi

    # Function to generate JWT
    generate_jwt() {
      local app_id="$1"
      local private_key="$2"

      # Current time
      local now header_b64 payload_b64 signature
      now=$(date +%s)
      local iat=$((now - 60))  # Allow for clock drift
      local exp=$((now + 600))  # 10 minutes from now

      # JWT header
      local header='{"alg":"RS256","typ":"JWT"}'
      header_b64=$(echo -n "$header" | base64 | tr -d '=' | tr '/+' '_-' | tr -d '\n')

      # JWT payload
      local payload="{\"iat\":$iat,\"exp\":$exp,\"iss\":\"$app_id\"}"
      payload_b64=$(echo -n "$payload" | base64 | tr -d '=' | tr '/+' '_-' | tr -d '\n')

      # Create signature
      signature=$(echo -n "${header_b64}.${payload_b64}" | \
        openssl dgst -sha256 -sign <(echo "$private_key") | \
        base64 | tr -d '=' | tr '/+' '_-' | tr -d '\n')

      echo "${header_b64}.${payload_b64}.${signature}"
    }

    echo "Generating JWT for GitHub App authentication..."
    JWT=$(generate_jwt "$RENOVATE_APP_ID" "$RENOVATE_APP_PRIVATE_KEY")

    echo "Fetching list of installations..."
    if ! INSTALLATIONS=$(curl -fsS -H "Authorization: Bearer $JWT" \
      -H "Accept: application/vnd.github+json" \
      https://api.github.com/app/installations | jq -er '.[].id'); then
      echo "ERROR: Could not discover installations for this GitHub App"
      exit 1
    fi

    INSTALLATION_COUNT=$(echo "$INSTALLATIONS" | wc -l | tr -d ' ')
    echo "Found $INSTALLATION_COUNT installation(s)"

    # Process each installation
    CURRENT=0
    EXIT_STATUS=0
    for INSTALLATION_ID in $INSTALLATIONS; do
      CURRENT=$((CURRENT + 1))
      echo ""
      echo "========================================="
      echo "Processing installation $CURRENT/$INSTALLATION_COUNT (ID: $INSTALLATION_ID)"
      echo "========================================="

      # Generate installation access token
      # A previous Renovate run can outlive the App JWT's 10-minute lifetime.
      JWT=$(generate_jwt "$RENOVATE_APP_ID" "$RENOVATE_APP_PRIVATE_KEY")
      echo "Generating access token for installation $INSTALLATION_ID..."
      if ! TOKEN_RESPONSE=$(curl -fsS -X POST \
        -H "Authorization: Bearer $JWT" \
        -H "Accept: application/vnd.github+json" \
        "https://api.github.com/app/installations/$INSTALLATION_ID/access_tokens"); then
        echo "ERROR: Failed to generate token for installation $INSTALLATION_ID"
        EXIT_STATUS=1
        continue
      fi

      if ! TOKEN=$(echo "$TOKEN_RESPONSE" | jq -er '.token | select(type == "string" and length > 0)'); then
        echo "ERROR: No token returned for installation $INSTALLATION_ID"
        EXIT_STATUS=1
        continue
      fi

      echo "Token generated successfully (expires in 1 hour)"

      # Run Renovate with this installation token
      echo "Running Renovate..."
      export RENOVATE_TOKEN="$TOKEN"

      if renovate "$@"; then
        echo "✓ Renovate completed successfully for installation $INSTALLATION_ID"
      else
        echo "✗ Renovate failed for installation $INSTALLATION_ID"
        EXIT_STATUS=1
      fi

      # Unset token for security
      unset RENOVATE_TOKEN TOKEN TOKEN_RESPONSE
    done

    echo ""
    echo "========================================="
    if [ "$EXIT_STATUS" -eq 0 ]; then
      echo "All installations processed successfully!"
    else
      echo "ERROR: One or more installations failed"
    fi
    echo "========================================="
    exit "$EXIT_STATUS"
