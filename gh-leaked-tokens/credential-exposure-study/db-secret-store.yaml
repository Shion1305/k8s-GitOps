apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-credential-exposure-db
  namespace: gh-leaked-tokens
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: k8s-postgres-credential-exposure
  namespace: gh-leaked-tokens
spec:
  provider:
    kubernetes:
      remoteNamespace: postgres-operator-deployment
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-credential-exposure-db
