apiVersion: apps/v1
kind: Deployment
metadata:
  name: credential-exposure-study
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: credential-exposure-study
  template:
    metadata:
      labels:
        app.kubernetes.io/name: credential-exposure-study
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: survey
          image: harbor.i.shion1305.com/shion1305/credential-exposure-study:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: credential-exposure-study-db
                  key: DB_URL
            - name: SHARED_REPORT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: credential-exposure-reports-db
                  key: DB_URL
                  # Public pages can ship first; /r/ fails closed without this.
                  optional: true
            - name: ADMIN_OIDC_ISSUER
              value: https://keycloak.shion1305.com/realms/credential-exposure
            - name: ADMIN_OIDC_AUDIENCE
              value: credential-exposure-admin
            - name: ADMIN_OIDC_ALLOWED_SUBJECTS
              valueFrom:
                secretKeyRef:
                  name: credential-exposure-admin-oidc
                  key: allowed-subjects
                  optional: true
            - name: ADMIN_DASHBOARD_DATA_FILE
              value: /var/run/notification-dashboard/dashboard.json
            - name: ADMIN_DASHBOARD_EVIDENCE_DIR
              value: /var/run/notification-evidence
            - name: PG_POOL_MAX
              value: "5"
            # Open only after live personalized-link, consent, and save checks.
            - name: SURVEY_PARTICIPATION_OPEN
              value: "false"
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: notification-dashboard
              mountPath: /var/run/notification-dashboard
              readOnly: true
            - name: notification-evidence
              mountPath: /var/run/notification-evidence
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        # Keep public pages available before dashboard provisioning. /admin
        # rejects access when authentication or the private export is missing.
        - name: notification-dashboard
          secret:
            secretName: credential-exposure-admin-review
            optional: true
            defaultMode: 0440
            items:
              - key: dashboard.json
                path: dashboard.json
        # All evidence files share a flat directory. The private publication
        # preflight rejects duplicate filenames and includes manifest.json once.
        - name: notification-evidence
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: credential-exposure-admin-evidence-01
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-02
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-03
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-04
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-05
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-06
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-07
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-08
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-09
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-10
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-11
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-12
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-13
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-14
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-15
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-16
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-17
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-18
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-19
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-20
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-21
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-22
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-23
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-24
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-25
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-26
                  optional: true
              - secret:
                  name: credential-exposure-admin-evidence-27
                  optional: true
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 64Mi
