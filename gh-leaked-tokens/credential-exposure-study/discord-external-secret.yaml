apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: credential-exposure-discord
  namespace: gh-leaked-tokens
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: credential-exposure-discord
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          managed-by: external-secrets
  data:
    - secretKey: webhook-url
      remoteRef:
        key: credential-exposure-discord
        property: webhook_url
