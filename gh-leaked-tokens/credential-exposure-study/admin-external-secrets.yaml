apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: credential-exposure-admin-oidc
  namespace: gh-leaked-tokens
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: credential-exposure-admin-oidc
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          managed-by: external-secrets
  data:
    - secretKey: client-id
      remoteRef:
        key: credential-exposure-admin-oidc
        property: client_id
    - secretKey: client-secret
      remoteRef:
        key: credential-exposure-admin-oidc
        property: client_secret
    - secretKey: allowed-subjects
      remoteRef:
        key: credential-exposure-admin-oidc
        property: allowed_subjects
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: credential-exposure-admin-review
  namespace: gh-leaked-tokens
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: credential-exposure-admin-review
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          managed-by: external-secrets
  data:
    - secretKey: dashboard.json
      remoteRef:
        key: credential-exposure-admin-review
        property: dashboard
