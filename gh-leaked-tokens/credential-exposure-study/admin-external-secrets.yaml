apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: credential-exposure-admin-auth
  namespace: gh-leaked-tokens
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: credential-exposure-admin-auth
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          managed-by: external-secrets
  data:
    - secretKey: username
      remoteRef:
        key: credential-exposure-admin-auth
        property: username
    - secretKey: password
      remoteRef:
        key: credential-exposure-admin-auth
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: credential-exposure-admin-review
  namespace: gh-leaked-tokens
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: credential-exposure-admin-review
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          managed-by: external-secrets
  data:
    - secretKey: dashboard.json
      remoteRef:
        key: credential-exposure-admin-review
        property: dashboard
