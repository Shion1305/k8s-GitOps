apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: credential-exposure-admin-oidc
  namespace: gh-leaked-tokens
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: credential-exposure-admin
  oidc:
    provider:
      issuer: https://keycloak.shion1305.com/realms/credential-exposure
    clientIDRef:
      name: credential-exposure-admin-oidc
    clientSecret:
      name: credential-exposure-admin-oidc
    redirectURL: https://credentials.research.shion.dev/admin/oauth2/callback
    logoutPath: /admin/logout
    # The app verifies the JWT and its subject allowlist before reading data.
    # A successful login alone does not authorize access to the dashboard.
    forwardAccessToken: true
    cookieConfig:
      sameSite: Lax
