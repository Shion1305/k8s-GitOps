# Dedicated private file maps; no evidence values or filenames belong in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: credential-exposure-admin-evidence-01
  namespace: gh-leaked-tokens
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: credential-exposure-admin-evidence-01
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          managed-by: external-secrets
  dataFrom:
    - extract:
        key: credential-exposure-admin-evidence-01
---
