apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: credential-exposure-admin
spec:
  parentRefs:
    - name: external
      namespace: envoy-gateway-system
      sectionName: https-research-shion-dev
  hostnames:
    - credentials.research.shion.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      backendRefs:
        - name: credential-exposure-study
          port: 3000
