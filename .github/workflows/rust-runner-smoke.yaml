name: Rust runner smoke

on:
  workflow_dispatch:
    inputs:
      runner_pool:
        description: GARM pool to validate; the dedicated Rust pool runs only on shion-ubuntu-2605
        type: choice
        required: true
        default: shion1305-ubuntu-2605-rust
        options:
          - shion1305-ubuntu-2605-rust
          - shion1305-amd
          - shion1305-arm

permissions:
  contents: read

jobs:
  rust-smoke:
    name: Rust smoke (${{ inputs.runner_pool }})
    runs-on: ${{ inputs.runner_pool }}
    timeout-minutes: 30
    env:
      # Match rust-smoke/rust-toolchain.toml so rust-cache can query rustc at repo root.
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@v7

      - name: Verify runner architecture
        env:
          EXPECTED_MACHINE: ${{ inputs.runner_pool == 'shion1305-arm' && 'aarch64' || 'x86_64' }}
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"

      - name: Verify preinstalled Rust toolchain
        if: inputs.runner_pool == 'shion1305-ubuntu-2605-rust'
        run: |
          test "$RUSTUP_HOME" = /usr/local/rustup
          rustup toolchain list
          rustc --version | grep -F '1.99.1'
          cargo fmt --version
          cargo clippy --version

      - name: Install Rust and restore Cargo cache
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          rust-src-dir: github-actions-runner/rust-smoke
          cache-workspaces: github-actions-runner/rust-smoke -> target
          cache-key: runner-smoke-${{ inputs.runner_pool }}
          cache-bin: 'false'
          cache-on-failure: 'false'

      - name: Verify Rust from repository root
        run: rustc --version

      - name: Fetch Cargo dependencies
        working-directory: github-actions-runner/rust-smoke
        run: cargo fetch --locked

      - name: Build and test
        working-directory: github-actions-runner/rust-smoke
        run: |
          cargo build --locked
          cargo test --locked
