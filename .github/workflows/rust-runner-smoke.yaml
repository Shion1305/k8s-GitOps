name: Rust runner smoke

on:
  workflow_dispatch:
    inputs:
      arm_runner:
        description: arm64 GARM pool to validate
        type: choice
        required: true
        default: shion1305-arm
        options:
          - shion1305-arm
          - shion1305-arm-rust

permissions:
  contents: read

jobs:
  rust-smoke:
    name: Rust smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && inputs.arm_runner || matrix.runner }}
    timeout-minutes: 30
    env:
      # Match rust-smoke/rust-toolchain.toml so rust-cache can query rustc at repo root.
      RUSTUP_TOOLCHAIN: '1.99.1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: shion1305-amd
            arch: amd64
            machine: x86_64
          - runner: shion1305-arm
            arch: arm64
            machine: aarch64
    steps:
      - uses: actions/checkout@v7

      - name: Verify runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"

      - name: Verify preinstalled Rust toolchain
        if: matrix.arch == 'arm64' && inputs.arm_runner == 'shion1305-arm-rust'
        run: |
          test "$RUSTUP_HOME" = /usr/local/rustup
          rustup toolchain list
          rustc --version | grep -F '1.99.1'
          cargo fmt --version
          cargo clippy --version

      - name: Install Rust and restore Cargo cache
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          rust-src-dir: github-actions-runner/rust-smoke
          cache-workspaces: github-actions-runner/rust-smoke -> target
          cache-key: runner-smoke-${{ matrix.arch }}
          cache-bin: 'false'
          cache-on-failure: 'false'

      - name: Verify Rust from repository root
        run: rustc --version

      - name: Fetch Cargo dependencies
        working-directory: github-actions-runner/rust-smoke
        run: cargo fetch --locked

      - name: Build and test
        working-directory: github-actions-runner/rust-smoke
        run: |
          cargo build --locked
          cargo test --locked
