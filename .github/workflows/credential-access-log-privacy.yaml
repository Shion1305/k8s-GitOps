name: Credential access-log privacy

on:
  pull_request:
    paths:
      - envoy-gateway/**
      - gh-leaked-tokens/credential-exposure-study/httproute.yaml
      - harbor/httproute-*.yaml
      - scripts/verify-credential-access-logs.py
      - .github/workflows/credential-access-log-privacy.yaml
  push:
    branches: [main]
    paths:
      - envoy-gateway/**
      - scripts/verify-credential-access-logs.py
      - .github/workflows/credential-access-log-privacy.yaml

permissions:
  contents: read

jobs:
  envoy-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: aquaproj/aqua-installer@v4.0.5
        with:
          aqua_version: v2.59.1
      - name: Install the deployed Envoy Gateway translator
        run: |
          curl -fsSL https://github.com/envoyproxy/gateway/releases/download/v1.9.0/egctl_v1.9.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/egctl.tar.gz"
          printf '%s  %s\n' 21cd5ec3f5f9422f86216a26d743796f21d014c9371c96d2ebb8bbd272335397 "$RUNNER_TEMP/egctl.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/egctl.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bin/linux/amd64" >> "$GITHUB_PATH"
      - name: Verify generated filters and real Envoy request logging
        run: python3 scripts/verify-credential-access-logs.py
