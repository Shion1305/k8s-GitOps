apiVersion: v1
kind: ConfigMap
metadata:
  name: garm-provider-config
  namespace: github-actions-runner
data:
  garm-provider-k8s-amd64.yaml: |
    kubeConfigPath: ""
    runnerNamespace: "github-actions-runner-pods"
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/managed-by: garm
      spec:
        nodeSelector:
          kubernetes.io/arch: amd64
        # Spread runners across amd64 nodes. Without this the scheduler's
        # ImageLocality score piles every runner onto whichever node already
        # cached the (large) runner image, and that node's serialized image-pull
        # queue becomes the bottleneck for the whole cluster. Soft
        # (ScheduleAnyway) so a single reachable node still accepts runners.
        topologySpreadConstraints:
          - maxSkew: 2
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/managed-by: garm
        # Re-pull the mutable image tag on every cold start so runners pick up
        # image rebuilds (e.g. the buildx wiring) instead of a stale cached layer.
        containers:
          - name: runner
            imagePullPolicy: Always
    flavors:
      default:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 4Gi
  garm-provider-k8s-rust-amd64-2605.yaml: |
    kubeConfigPath: ""
    runnerNamespace: "github-actions-runner-pods"
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/managed-by: garm
      spec:
        # Hard placement: these jobs wait while 2605 is unavailable rather than
        # silently landing on the other amd64 node.
        # Runner jobs do not need Kubernetes API access.
        automountServiceAccountToken: false
        nodeSelector:
          kubernetes.io/arch: amd64
          kubernetes.io/hostname: shion-ubuntu-2605
        # The provider omits its default emptyDir when this named volume is
        # present. Kubernetes owns the claim for this ephemeral runner Pod.
        volumes:
          - name: runner
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: garm-2605-workspace
                  resources:
                    requests:
                      storage: 16Gi
        containers:
          - name: runner
            # The 2605 pool requires an image@sha256 reference, so a cached
            # copy of that exact image is safe to reuse on each ephemeral Pod.
            imagePullPolicy: IfNotPresent
            # Keep Rust binaries/toolchains in their prebuilt image layers.
            # Put Cargo downloads and other caches on the SATA /runner PVC.
            env:
              - name: CARGO_HOME
                value: /runner/.cargo
              - name: XDG_CACHE_HOME
                value: /runner/.cache
    flavors:
      default:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 16Gi
  garm-provider-k8s-arm64.yaml: |
    kubeConfigPath: ""
    runnerNamespace: "github-actions-runner-pods"
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/managed-by: garm
      spec:
        nodeSelector:
          kubernetes.io/arch: arm64
        # See the amd64 template above for why runners are spread by hostname.
        topologySpreadConstraints:
          - maxSkew: 2
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/managed-by: garm
        # Re-pull the mutable image tag on every cold start so runners pick up
        # image rebuilds (e.g. the buildx wiring) instead of a stale cached layer.
        containers:
          - name: runner
            imagePullPolicy: Always
    flavors:
      default:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 4Gi
