apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: pagerduty-events
spec:
  namespaceSelectors:
    - matchLabels:
        secrets.shion1305.com/pagerduty: enabled
  refreshTime: 1m
  externalSecretSpec:
    refreshInterval: 5m
    secretStoreRef:
      name: vault-pagerduty
      kind: ClusterSecretStore
    target:
      name: pagerduty-events
      creationPolicy: Owner
      deletionPolicy: Retain
      template:
        type: Opaque
    data:
      - secretKey: routing-key
        remoteRef:
          key: pagerduty
          property: routing-key
