# The app credential store cannot read the pipeline-owner credential.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-credential-exposure-db
  namespace: postgres-operator-deployment
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - survey-app.postgres-shared.credentials.postgresql.acid.zalan.do
      - disclosure-report-app.postgres-shared.credentials.postgresql.acid.zalan.do
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-credential-exposure-db
  namespace: postgres-operator-deployment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-credential-exposure-db
subjects:
  - kind: ServiceAccount
    name: eso-credential-exposure-db
    namespace: gh-leaked-tokens
