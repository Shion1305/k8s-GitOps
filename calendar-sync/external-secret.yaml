apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calendar-sync-google
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: calendar-sync-google
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: config.yaml
      remoteRef:
        key: google
        property: config.yaml
    - secretKey: credentials.json
      remoteRef:
        key: google
        property: credentials.json
    - secretKey: token.json
      remoteRef:
        key: google
        property: token.json
