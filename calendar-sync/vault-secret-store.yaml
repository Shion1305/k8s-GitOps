apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: calendar-sync
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-calendar-sync
          serviceAccountRef:
            name: eso
