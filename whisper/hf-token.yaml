# Materializes the Hugging Face token from Vault
# (whisper/huggingface, property `token`). The value is written to Vault
# out-of-band and is never committed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: whisper-hf-token
  namespace: whisper
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: whisper-hf-token
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: whisper
          app.kubernetes.io/managed-by: external-secrets
  data:
    - secretKey: token
      remoteRef:
        key: huggingface
        property: token
