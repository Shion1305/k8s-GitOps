# Materializes the API bearer key from Vault (whisper/api, property `api-key`).
# The value is written to Vault out-of-band and is never committed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: whisper-api-key
  namespace: whisper
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: whisper-api-key
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: whisper
          app.kubernetes.io/managed-by: external-secrets
  data:
    - secretKey: api-key
      remoteRef:
        key: api
        property: api-key
