apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso
  namespace: whisper
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: whisper
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: whisper
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-whisper
          serviceAccountRef:
            name: eso
