model: whisper-large-v3
device: p150
engine: media
impl: whisper

# openai/whisper-large-v3 is public. Keep credentials out of Git and download
# anonymously into the persistent node-local cache on first startup.
hfToken: ""

fullnameOverride: whisper

cache:
  hostPath: /var/lib/tt-inference-server/cache/whisper-large-v3-p150

# The model-specific leaf overrides defaults in the upstream chart. Allow a
# slow first download to run for 12 hours before the startup probe retries it.
models:
  whisper-large-v3:
    media:
      p150:
        impls:
          whisper:
            progressDeadlineSeconds: 43200

defaults:
  replicaCount: 1
  dra:
    deviceClassName: tenstorrent.com
  nodeSelector:
    feature.node.kubernetes.io/pci-1200_1e52.present: "true"
  resources:
    limits:
      # This node has eight 1 Gi hugepages. The upstream 32 Gi default targets
      # larger systems and would make this workload permanently unschedulable.
      hugepages-1Gi: 8Gi
    requests:
      cpu: "6"
      memory: 6Gi
      hugepages-1Gi: 8Gi
  extraEnv:
    # Hugging Face otherwise defaults to the container writable layer, so a
    # startup-probe restart would discard a partially downloaded model.
    - name: HF_HOME
      value: /home/container_app_user/cache_root/huggingface
    - name: API_KEY
      valueFrom:
        secretKeyRef:
          name: whisper-api-key
          key: api-key
