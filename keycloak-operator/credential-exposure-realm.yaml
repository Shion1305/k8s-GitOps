# Creation-only import. Bootstrap the dedicated broker client in realm `user`
# and the referenced private Secret before merging; see the dashboard runbook.
# Existing realm changes require the Admin UI/API, not re-import or deletion.
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: credential-exposure
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  placeholders:
    DASHBOARD_CLIENT_SECRET:
      secret:
        name: credential-exposure-realm-bootstrap
        key: dashboard-client-secret
    DASHBOARD_BROKER_SECRET:
      secret:
        name: credential-exposure-realm-bootstrap
        key: broker-client-secret
    DASHBOARD_OWNER_SUBJECT:
      secret:
        name: credential-exposure-realm-bootstrap
        key: owner-subject
    DASHBOARD_SOURCE_SUBJECT:
      secret:
        name: credential-exposure-realm-bootstrap
        key: source-subject
  realm:
    realm: credential-exposure
    displayName: Credential exposure dashboard
    enabled: true
    sslRequired: external
    registrationAllowed: false
    resetPasswordAllowed: false
    rememberMe: false
    duplicateEmailsAllowed: false
    editUsernameAllowed: false
    defaultSignatureAlgorithm: RS256
    browserFlow: credential-exposure-browser
    authenticationFlows:
      - alias: credential-exposure-browser
        description: Reuse the user realm login without local password authentication
        providerId: basic-flow
        topLevel: true
        builtIn: false
        authenticationExecutions:
          - authenticator: auth-cookie
            authenticatorFlow: false
            requirement: ALTERNATIVE
            priority: 10
          - authenticator: identity-provider-redirector
            authenticatorConfig: credential-exposure-user-redirect
            authenticatorFlow: false
            requirement: ALTERNATIVE
            priority: 20
      - alias: credential-exposure-deny-unlinked
        description: Only the explicitly linked owner can enter through the broker
        providerId: basic-flow
        topLevel: true
        builtIn: false
        authenticationExecutions:
          - authenticator: deny-access-authenticator
            authenticatorFlow: false
            requirement: REQUIRED
            priority: 10
    authenticatorConfig:
      - alias: credential-exposure-user-redirect
        config:
          defaultProvider: user
    clients:
      - clientId: credential-exposure-admin
        name: Credential exposure dashboard
        enabled: true
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: ${DASHBOARD_CLIENT_SECRET}
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        fullScopeAllowed: false
        redirectUris:
          - https://credentials.research.shion.dev/admin/oauth2/callback
        webOrigins:
          - https://credentials.research.shion.dev
        defaultClientScopes:
          - basic
          - profile
        protocolMappers:
          - name: credential-exposure-admin-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: credential-exposure-admin
              id.token.claim: "false"
              access.token.claim: "true"
    identityProviders:
      - alias: user
        displayName: Sign in with your account
        providerId: keycloak-oidc
        enabled: true
        storeToken: false
        addReadTokenRoleOnCreate: false
        trustEmail: false
        firstBrokerLoginFlowAlias: credential-exposure-deny-unlinked
        config:
          issuer: https://keycloak.shion1305.com/realms/user
          authorizationUrl: https://keycloak.shion1305.com/realms/user/protocol/openid-connect/auth
          tokenUrl: https://keycloak.shion1305.com/realms/user/protocol/openid-connect/token
          userInfoUrl: https://keycloak.shion1305.com/realms/user/protocol/openid-connect/userinfo
          logoutUrl: https://keycloak.shion1305.com/realms/user/protocol/openid-connect/logout
          jwksUrl: https://keycloak.shion1305.com/realms/user/protocol/openid-connect/certs
          useJwksUrl: "true"
          validateSignature: "true"
          clientAuthMethod: client_secret_post
          clientId: credential-exposure-broker
          clientSecret: ${DASHBOARD_BROKER_SECRET}
          defaultScope: openid profile
          syncMode: IMPORT
    users:
      - id: ${DASHBOARD_OWNER_SUBJECT}
        username: shion1305
        enabled: true
        requiredActions: []
        federatedIdentities:
          - identityProvider: user
            userId: ${DASHBOARD_SOURCE_SUBJECT}
            userName: shion1305
